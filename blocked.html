<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site blocked</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #4b5563;
      --accent: #667eea;
      --danger: #d32f2f;
      --border: #e5e7eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111318;
        --card: #1c1f26;
        --text: #f3f4f6;
        --muted: #a1a7b3;
        --accent: #8b9cf4;
        --danger: #f87171;
        --border: #2d323c;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    main {
      width: min(480px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-top: 5px solid var(--danger);
      border-radius: 12px;
      padding: 32px 28px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
    }
    .icon { font-size: 44px; line-height: 1; margin-bottom: 12px; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    .domain { margin: 0 0 16px; font-size: 17px; font-weight: 600; color: var(--danger); word-break: break-all; }
    p { margin: 0 0 24px; color: var(--muted); line-height: 1.5; font-size: 15px; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; }
    button {
      flex: 1 1 160px;
      padding: 12px 16px;
      border-radius: 6px;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .primary { background: var(--accent); color: #fff; border: 1px solid var(--accent); }
    .secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main role="main" aria-labelledby="title">
    <div class="icon" aria-hidden="true">⛔</div>
    <h1 id="title">This site is blocked</h1>
    <p class="domain" id="domain"></p>
    <p>You blocked this site to stay productive. Remove it from the <strong>Blocked</strong> tab in Productivity Assistant if you need it again.</p>
    <div class="actions">
      <button type="button" class="primary" id="back">← Go back</button>
      <button type="button" class="secondary" id="close">Close tab</button>
    </div>
  </main>
  <script src="blocked/blocked.js"></script>
</body>
</html>
